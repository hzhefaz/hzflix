<svg width="100%" viewBox="0 0 900 110" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fadeL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="1"/>
      <stop offset="14%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="86%" stop-color="#0a0a0a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="pill0"><rect width="150" height="60" rx="30"/></clipPath>
  </defs>

  <rect width="900" height="110" fill="#0a0a0a"/>

  <!-- ─── TRACK ─── scrolls 9 pills × 170px = 1530px, duplicated for seamless loop -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0;-1530,0" dur="22s" calcMode="linear" repeatCount="indefinite"/>

    <!-- ── PILL TEMPLATE: pill at x, label, icon path centred at (x+75, 32) ── -->

    <!-- 1 MOVIES  (film clapperboard) -->
    <g transform="translate(20,25)">
      <rect width="150" height="60" rx="30" fill="#1a1a1a" stroke="#E53935" stroke-width="1" stroke-opacity="0.45"/>
      <g transform="translate(64,10)" fill="none" stroke="#E53935" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <!-- Film strip -->
        <rect x="2" y="2" width="18" height="20" rx="2" />
        <line x1="6" y1="2" x2="6" y2="22" />
        <line x1="16" y1="2" x2="16" y2="22" />
        <line x1="2" y1="7" x2="6" y2="7" />
        <line x1="2" y1="12" x2="6" y2="12" />
        <line x1="2" y1="17" x2="6" y2="17" />
        <line x1="16" y1="7" x2="20" y2="7" />
        <line x1="16" y1="12" x2="20" y2="12" />
        <line x1="16" y1="17" x2="20" y2="17" />
        <polygon points="9,9 14,12 9,15" fill="#E53935" fill-opacity="0.1"/>
      </g>
      <text x="75" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" letter-spacing="1.5" fill="#888888">MOVIES</text>
    </g>

    <!-- 2 TV SHOWS  (monitor + antenna) -->
    <g transform="translate(190,25)">
      <rect width="150" height="60" rx="30" fill="#1a1a1a" stroke="#E53935" stroke-width="1" stroke-opacity="0.45"/>
      <g transform="translate(64,10)" fill="none" stroke="#E53935" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <!-- Modern TV -->
        <rect x="0" y="4" width="22" height="14" rx="2" />
        <line x1="11" y1="18" x2="11" y2="22" />
        <line x1="6" y1="22" x2="16" y2="22" />
        <polygon points="9,8 14,11 9,14" fill="#E53935" fill-opacity="0.1"/>
      </g>
      <text x="75" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" letter-spacing="1.5" fill="#888888">TV SHOWS</text>
    </g>

    <!-- 3 ANIME  (play triangle inside diamond/star shape) -->
    <g transform="translate(360,25)">
      <rect width="150" height="60" rx="30" fill="#1a1a1a" stroke="#E53935" stroke-width="1" stroke-opacity="0.45"/>
      <g transform="translate(64,10)" fill="none" stroke="#E53935" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <!-- cat ears -->
        <polygon points="3,9 2,2 8,5" fill="#E53935" fill-opacity="0.1"/>
        <polygon points="19,9 20,2 14,5" fill="#E53935" fill-opacity="0.1"/>
        <!-- face circle -->
        <circle cx="11" cy="12" r="9" fill="#E53935" fill-opacity="0.1"/>
        <!-- happy eyes -->
        <path d="M6.5 11 Q8 9 9.5 11" />
        <path d="M12.5 11 Q14 9 15.5 11" />
        <!-- cute mouth -->
        <path d="M9 14 Q11 16 13 14" />
      </g>
      <text x="75" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" letter-spacing="1.5" fill="#888888">ANIME</text>
    </g>

    <!-- 4 MUSIC  (music note) -->
    <g transform="translate(530,25)">
      <rect width="150" height="60" rx="30" fill="#1a1a1a" stroke="#E53935" stroke-width="1" stroke-opacity="0.45"/>
      <g transform="translate(64,10)" fill="none" stroke="#E53935" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <!-- stem -->
        <line x1="15" y1="2" x2="15" y2="18"/>
        <!-- flag -->
        <path d="M15 2 Q22 4 20 10" stroke="#E53935" fill="none"/>
        <!-- note head -->
        <ellipse cx="13" cy="19" rx="4" ry="3" transform="rotate(-15 13 19)" fill="#E53935" stroke="none" opacity="0.8"/>
      </g>
      <text x="75" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" letter-spacing="1.5" fill="#888888">MUSIC</text>
    </g>

    <!-- 5 LIVE CRICKET  (cricket bat + ball) -->
    <g transform="translate(700,25)">
      <rect width="150" height="60" rx="30" fill="#1a1a1a" stroke="#E53935" stroke-width="1" stroke-opacity="0.45"/>
      <g transform="translate(64,10)" fill="none" stroke="#E53935" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <!-- true cricket bat -->
        <g transform="rotate(35 11 11)">
          <line x1="11" y1="1" x2="11" y2="6" stroke-width="2"/>
          <path d="M8 6 L14 6 L14 18 C14 20 12 21 11 21 C10 21 8 20 8 18 Z" fill="#E53935" fill-opacity="0.1"/>
          <line x1="11" y1="6" x2="11" y2="21" stroke-width="1"/>
        </g>
        <!-- cricket ball -->
        <circle cx="19" cy="16" r="3.5" fill="#E53935" fill-opacity="0.1"/>
        <path d="M17 14 Q19 16 17 18" stroke-width="1"/>
      </g>
      <text x="75" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" letter-spacing="1.5" fill="#888888">CRICKET</text>
    </g>

    <!-- 6 FOOTBALL  (circle + pentagon lines) -->
    <g transform="translate(870,25)">
      <rect width="150" height="60" rx="30" fill="#1a1a1a" stroke="#E53935" stroke-width="1" stroke-opacity="0.45"/>
      <g transform="translate(64,10)" fill="none" stroke="#E53935" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="10"/>
        <polygon points="11,5 14,8 13,12 9,12 8,8" fill="#E53935" opacity="0.7" stroke="none"/>
        <line x1="11" y1="5" x2="11" y2="1"/>
        <line x1="14" y1="8" x2="18" y2="6"/>
        <line x1="13" y1="12" x2="16" y2="16"/>
        <line x1="9" y1="12" x2="6" y2="16"/>
        <line x1="8"  y1="8" x2="4" y2="6"/>
      </g>
      <text x="75" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" letter-spacing="1.5" fill="#888888">FOOTBALL</text>
    </g>

    <!-- 7 DOWNLOADS  (arrow down into tray) -->
    <g transform="translate(1040,25)">
      <rect width="150" height="60" rx="30" fill="#1a1a1a" stroke="#E53935" stroke-width="1" stroke-opacity="0.45"/>
      <g transform="translate(64,10)" fill="none" stroke="#E53935" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="11" y1="1" x2="11" y2="16"/>
        <polyline points="6,11 11,17 16,11"/>
        <path d="M2 19 L2 22 L20 22 L20 19" stroke-width="1.4"/>
      </g>
      <text x="75" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" letter-spacing="1.5" fill="#888888">DOWNLOADS</text>
    </g>

    <!-- 8 LIVE TV  (signal tower) -->
    <g transform="translate(1210,25)">
      <rect width="150" height="60" rx="30" fill="#1a1a1a" stroke="#E53935" stroke-width="1" stroke-opacity="0.45"/>
      <g transform="translate(64,10)" fill="none" stroke="#E53935" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <!-- Camera body -->
        <rect x="1" y="6" width="14" height="10" rx="2" fill="#E53935" fill-opacity="0.1"/>
        <!-- Lens cone -->
        <polygon points="15,9 21,6 21,16 15,13" fill="#E53935" fill-opacity="0.1"/>
        <!-- Film reels -->
        <circle cx="5" cy="4" r="3"/>
        <circle cx="11" cy="4" r="3"/>
        <!-- Live recording dot -->
        <circle cx="11" cy="11" r="1.5" fill="#E53935" stroke="none"/>
      </g>
      <text x="75" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" letter-spacing="1.5" fill="#888888">LIVE TV</text>
    </g>

    <!-- 9 SEARCH  (magnifier) -->
    <g transform="translate(1380,25)">
      <rect width="150" height="60" rx="30" fill="#1a1a1a" stroke="#E53935" stroke-width="1" stroke-opacity="0.45"/>
      <g transform="translate(64,10)" fill="none" stroke="#E53935" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="10" r="7"/>
        <line x1="15.5" y1="15.5" x2="21" y2="21"/>
      </g>
      <text x="75" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" letter-spacing="1.5" fill="#888888">SEARCH</text>
    </g>

    <!-- ── DUPLICATE SET for seamless loop (offset +1530) ── -->

    <g transform="translate(1550,25)">
      <rect width="150" height="60" rx="30" fill="#1a1a1a" stroke="#E53935" stroke-width="1" stroke-opacity="0.45"/>
      <g transform="translate(64,10)" fill="none" stroke="#E53935" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="18" height="20" rx="2" />
        <line x1="6" y1="2" x2="6" y2="22" />
        <line x1="16" y1="2" x2="16" y2="22" />
        <line x1="2" y1="7" x2="6" y2="7" />
        <line x1="2" y1="12" x2="6" y2="12" />
        <line x1="2" y1="17" x2="6" y2="17" />
        <line x1="16" y1="7" x2="20" y2="7" />
        <line x1="16" y1="12" x2="20" y2="12" />
        <line x1="16" y1="17" x2="20" y2="17" />
        <polygon points="9,9 14,12 9,15" fill="#E53935" fill-opacity="0.1"/>
      </g>
      <text x="75" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" letter-spacing="1.5" fill="#888888">MOVIES</text>
    </g>

    <g transform="translate(1720,25)">
      <rect width="150" height="60" rx="30" fill="#1a1a1a" stroke="#E53935" stroke-width="1" stroke-opacity="0.45"/>
      <g transform="translate(64,10)" fill="none" stroke="#E53935" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <!-- Modern TV -->
        <rect x="0" y="4" width="22" height="14" rx="2" />
        <line x1="11" y1="18" x2="11" y2="22" />
        <line x1="6" y1="22" x2="16" y2="22" />
        <polygon points="9,8 14,11 9,14" fill="#E53935" fill-opacity="0.1"/>
      </g>
      <text x="75" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" letter-spacing="1.5" fill="#888888">TV SHOWS</text>
    </g>

    <g transform="translate(1890,25)">
      <rect width="150" height="60" rx="30" fill="#1a1a1a" stroke="#E53935" stroke-width="1" stroke-opacity="0.45"/>
      <g transform="translate(64,10)" fill="none" stroke="#E53935" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="3,9 2,2 8,5" fill="#E53935" fill-opacity="0.1"/>
        <polygon points="19,9 20,2 14,5" fill="#E53935" fill-opacity="0.1"/>
        <circle cx="11" cy="12" r="9" fill="#E53935" fill-opacity="0.1"/>
        <path d="M6.5 11 Q8 9 9.5 11" />
        <path d="M12.5 11 Q14 9 15.5 11" />
        <path d="M9 14 Q11 16 13 14" />
      </g>
      <text x="75" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" letter-spacing="1.5" fill="#888888">ANIME</text>
    </g>

    <g transform="translate(2060,25)">
      <rect width="150" height="60" rx="30" fill="#1a1a1a" stroke="#E53935" stroke-width="1" stroke-opacity="0.45"/>
      <g transform="translate(64,10)" fill="none" stroke="#E53935" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="15" y1="2" x2="15" y2="18"/>
        <path d="M15 2 Q22 4 20 10" stroke="#E53935" fill="none"/>
        <ellipse cx="13" cy="19" rx="4" ry="3" transform="rotate(-15 13 19)" fill="#E53935" stroke="none" opacity="0.8"/>
      </g>
      <text x="75" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" letter-spacing="1.5" fill="#888888">MUSIC</text>
    </g>

    <g transform="translate(2230,25)">
      <rect width="150" height="60" rx="30" fill="#1a1a1a" stroke="#E53935" stroke-width="1" stroke-opacity="0.45"/>
      <g transform="translate(64,10)" fill="none" stroke="#E53935" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <g transform="rotate(35 11 11)">
          <line x1="11" y1="1" x2="11" y2="6" stroke-width="2"/>
          <path d="M8 6 L14 6 L14 18 C14 20 12 21 11 21 C10 21 8 20 8 18 Z" fill="#E53935" fill-opacity="0.1"/>
          <line x1="11" y1="6" x2="11" y2="21" stroke-width="1"/>
        </g>
        <circle cx="19" cy="16" r="3.5" fill="#E53935" fill-opacity="0.1"/>
        <path d="M17 14 Q19 16 17 18" stroke-width="1"/>
      </g>
      <text x="75" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" letter-spacing="1.5" fill="#888888">CRICKET</text>
    </g>

    <g transform="translate(2400,25)">
      <rect width="150" height="60" rx="30" fill="#1a1a1a" stroke="#E53935" stroke-width="1" stroke-opacity="0.45"/>
      <g transform="translate(64,10)" fill="none" stroke="#E53935" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="10"/>
        <polygon points="11,5 14,8 13,12 9,12 8,8" fill="#E53935" opacity="0.7" stroke="none"/>
        <line x1="11" y1="5" x2="11" y2="1"/>
        <line x1="14" y1="8" x2="18" y2="6"/>
        <line x1="13" y1="12" x2="16" y2="16"/>
        <line x1="9" y1="12" x2="6" y2="16"/>
        <line x1="8"  y1="8" x2="4" y2="6"/>
      </g>
      <text x="75" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" letter-spacing="1.5" fill="#888888">FOOTBALL</text>
    </g>

    <g transform="translate(2570,25)">
      <rect width="150" height="60" rx="30" fill="#1a1a1a" stroke="#E53935" stroke-width="1" stroke-opacity="0.45"/>
      <g transform="translate(64,10)" fill="none" stroke="#E53935" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="11" y1="1" x2="11" y2="16"/>
        <polyline points="6,11 11,17 16,11"/>
        <path d="M2 19 L2 22 L20 22 L20 19" stroke-width="1.4"/>
      </g>
      <text x="75" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" letter-spacing="1.5" fill="#888888">DOWNLOADS</text>
    </g>

    <g transform="translate(2740,25)">
      <rect width="150" height="60" rx="30" fill="#1a1a1a" stroke="#E53935" stroke-width="1" stroke-opacity="0.45"/>
      <g transform="translate(64,10)" fill="none" stroke="#E53935" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="6" width="14" height="10" rx="2" fill="#E53935" fill-opacity="0.1"/>
        <polygon points="15,9 21,6 21,16 15,13" fill="#E53935" fill-opacity="0.1"/>
        <circle cx="5" cy="4" r="3"/>
        <circle cx="11" cy="4" r="3"/>
        <circle cx="11" cy="11" r="1.5" fill="#E53935" stroke="none"/>
      </g>
      <text x="75" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" letter-spacing="1.5" fill="#888888">LIVE TV</text>
    </g>

    <g transform="translate(2910,25)">
      <rect width="150" height="60" rx="30" fill="#1a1a1a" stroke="#E53935" stroke-width="1" stroke-opacity="0.45"/>
      <g transform="translate(64,10)" fill="none" stroke="#E53935" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="10" r="7"/>
        <line x1="15.5" y1="15.5" x2="21" y2="21"/>
      </g>
      <text x="75" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" letter-spacing="1.5" fill="#888888">SEARCH</text>
    </g>

  </g>

  <!-- Fade edge overlays -->
  <rect width="900" height="110" fill="url(#fadeL)"/>
  <rect width="900" height="110" fill="url(#fadeR)"/>

  <!-- Top / bottom accent lines -->
  <rect width="900" height="1.5" fill="#E53935" opacity="0.3"/>
  <rect y="108.5" width="900" height="1.5" fill="#E53935" opacity="0.3"/>
</svg>
