<svg width="100%" viewBox="0 0 900 280" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E53935" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#E53935"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E53935" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E53935" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E53935" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="#0a0a0a" rx="16"/>

  <!-- Glow blob -->
  <ellipse cx="450" cy="140" rx="340" ry="180" fill="url(#glow)">
    <animate attributeName="rx" values="340;380;340" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="180;200;180" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Decorative grid lines -->
  <g opacity="0.06" stroke="#E53935" stroke-width="0.5">
    <line x1="0" y1="70" x2="900" y2="70"/>
    <line x1="0" y1="140" x2="900" y2="140"/>
    <line x1="0" y1="210" x2="900" y2="210"/>
    <line x1="225" y1="0" x2="225" y2="280"/>
    <line x1="450" y1="0" x2="450" y2="280"/>
    <line x1="675" y1="0" x2="675" y2="280"/>
  </g>

  <!-- Animated corner accents -->
  <g stroke="#E53935" stroke-width="1.5" fill="none" opacity="0.5">
    <polyline points="20,50 20,20 50,20">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </polyline>
    <polyline points="850,50 850,20 820,20">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </polyline>
    <polyline points="20,230 20,260 50,260">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="0.75s" repeatCount="indefinite"/>
    </polyline>
    <polyline points="850,230 850,260 820,260">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="2.25s" repeatCount="indefinite"/>
    </polyline>
  </g>

  <!-- Main title -->
  <text x="450" y="125" text-anchor="middle"
        font-family="'Arial Black', 'Impact', sans-serif"
        font-size="72" font-weight="900" letter-spacing="10"
        fill="url(#textGrad)">
    HZ FLIX
    <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze"/>
    <animate attributeName="letter-spacing" values="24;10" dur="0.8s" fill="freeze"/>
  </text>

  <!-- Subtitle -->
  <text x="450" y="160" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12" letter-spacing="5" fill="#E53935" opacity="0">
    MOVIES · TV SHOWS · ANIME · MUSIC · LIVE
    <animate attributeName="opacity" values="0;0;0.85" dur="1.4s" fill="freeze" keyTimes="0;0.5;1"/>
  </text>

  <!-- Animated underline -->
  <rect x="150" y="172" width="600" height="1" fill="url(#lineGrad)" opacity="0">
    <animate attributeName="opacity" values="0;0;0.6" dur="1.6s" fill="freeze" keyTimes="0;0.6;1"/>
    <animate attributeName="x" values="450;150" dur="0.6s" begin="0.9s" fill="freeze"/>
    <animate attributeName="width" values="0;600" dur="0.6s" begin="0.9s" fill="freeze"/>
  </rect>

  <!-- Tagline -->
  <text x="450" y="208" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="11" letter-spacing="2" fill="#666666" opacity="0">
    Your Ultimate Entertainment Experience — Android
    <animate attributeName="opacity" values="0;0;0.6" dur="2s" fill="freeze" keyTimes="0;0.7;1"/>
  </text>

  <!-- Pulsing dots -->
  <g fill="#E53935">
    <circle cx="320" cy="242" r="2" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0.3;1" dur="2.5s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="340" cy="242" r="2" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0.3;1" dur="2.5s" repeatCount="indefinite" begin="1.7s"/>
    </circle>
    <circle cx="360" cy="242" r="2" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0.3;1" dur="2.5s" repeatCount="indefinite" begin="1.9s"/>
    </circle>
    <circle cx="540" cy="242" r="2" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0.3;1" dur="2.5s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="560" cy="242" r="2" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0.3;1" dur="2.5s" repeatCount="indefinite" begin="1.7s"/>
    </circle>
    <circle cx="580" cy="242" r="2" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0.3;1" dur="2.5s" repeatCount="indefinite" begin="1.9s"/>
    </circle>
  </g>
</svg>
